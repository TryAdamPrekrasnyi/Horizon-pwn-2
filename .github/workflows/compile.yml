name: Compile Horizon

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install 32-bit libs
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libc6:i386

      - name: Download pawncc
        run: |
          curl -L -o /tmp/pawnc.tar.gz https://github.com/pawn-lang/compiler/releases/download/v3.10.10/pawnc-3.10.10-linux.tar.gz
          mkdir -p /tmp/pawnc && tar -xzf /tmp/pawnc.tar.gz -C /tmp/pawnc
          chmod +x /tmp/pawnc/pawnc-3.10.10-linux/bin/pawncc

      - name: Compile
        run: |
          LD_LIBRARY_PATH=/tmp/pawnc/pawnc-3.10.10-linux/lib /tmp/pawnc/pawnc-3.10.10-linux/bin/pawncc HORIZON.pwn -oHORIZON.amx -iinclude -i/tmp/pawnc/pawnc-3.10.10-linux/include

      - name: Upload AMX
        uses: actions/upload-artifact@v4
        with:
          name: horizon-amx
          path: HORIZON.amx
